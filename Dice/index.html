<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Ρίξε από 1 έως 4 ζάρια και δες το άθροισμα και το συνολικό σκορ.">
<title>Ζάρια, Online</title>
<link rel="stylesheet" href="styles/main.css">
<link rel="stylesheet" href="styles/style.css">
</head>
<body>
<div id="dice-style-preview" lang="el">
  <nav aria-label="Επιστροφή"><a class="dice-home" href="../">← Επιστροφή στην αρχική</a></nav>
  <main>
    <h1>Ζάρια, Online</h1>
    <p>Ρίξε από 1 έως 4 ζάρια και δες το αποτέλεσμα.</p>
    <div class="dice-selection"><label for="dice-count-preview">Πόσα ζάρια;</label> <span class="dice-select-wrap"><select id="dice-count-preview"><option>1</option><option selected>2</option><option>3</option><option>4</option></select><span class="dice-select-arrow" aria-hidden="true">▾</span></span></div>
    <div class="dice-faces" aria-label="Ζάρια"></div>
    <button type="button" class="dice-roll">Ρίξε τα ζάρια</button>
    <div class="dice-results" aria-live="polite"><p>Φορές: <span data-result="rolls">0</span></p><p>Άθροισμα: <span data-result="sum">0</span></p><p>Σύνολο: <span data-result="total">0</span></p></div>
    <button type="button" class="dice-reset">Από την αρχή</button>
  </main>
</div>
<script src="scripts/script.js"></script>
</body>
</html>
